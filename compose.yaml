services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fintech_db
      MYSQL_USER: fintech
      MYSQL_PASSWORD: fintech
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fintech", "-pfintech"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fintech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: fintech
      DB_PASSWORD: fintech
    ports:
      - "8080:8080"

volumes:
  mysql-data:
