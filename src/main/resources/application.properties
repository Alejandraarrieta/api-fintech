spring.application.name=api-fintech

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/fintech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:fintech}
spring.datasource.password=${DB_PASSWORD:fintech}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.sql.init.data-locations=classpath:data-mysql.sql

springdoc.swagger-ui.path=/swagger-ui.html
